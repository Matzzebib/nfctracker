<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; height: 100%; }
  #msg { display: none; font-family: sans-serif; color: #999; text-align: center; padding-top: 40vh; }
</style>
</head>
<body>
  <div id="msg"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function logScan(linkId) {
      try {
        await fetch(SUPABASE_URL + '/rest/v1/scans', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ link_id: linkId })
        });
      } catch (e) {
        // On ne bloque jamais la redirection même si l'enregistrement échoue
      }
    }

    async function go() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('c');
      if (!code) return;

      const { data, error } = await sb.rpc('resolve_link', { p_code: code });
      const row = Array.isArray(data) ? data[0] : data;

      if (error || !row || !row.active) {
        const msg = document.getElementById('msg');
        msg.textContent = 'Lien invalide.';
        msg.style.display = 'block';
        return;
      }

      if (row.track_enabled) {
        await logScan(row.link_id);
      }

      window.location.replace('https://search.google.com/local/writereview?placeid=' + encodeURIComponent(row.place_id));
    }

    go();
  </script>
</body>
</html>
